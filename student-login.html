<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Login | S. M. Pilot Model School</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="portal.css" />
    <script src="student-login.js" defer></script>
  </head>
  <body class="portal-page">
    <main class="portal-main">
      <section class="portal-card login-card">
        <h1>Student Login</h1>
        <p>Continue to the school’s student portal.</p>
        <a id="portalLink" href="http://localhost:8080/login"
          >Open student login →</a
        >
        <p class="portal-hint">
          For local preview, keep the Go server running with
          <code>go run .</code>.
        </p>
        <noscript
          ><p>
            JavaScript is disabled. Use the link above to open the portal.
          </p></noscript
        >
      </section>
    </main>
  </body>
</html>
